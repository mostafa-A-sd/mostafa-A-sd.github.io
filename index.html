</html><!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق مصطفى - لوحة التحكم</title>
    <style>
        * {margin: 0; padding: 0; box-sizing: border-box; font-family: 'Cairo', sans-serif;}
        body {background: #f5f5f5; color: #222; padding-bottom: 80px;}
        header {background: #FFD700; padding: 15px; text-align: center; position: sticky; top: 0; z-index: 100; box-shadow: 0 2px 5px rgba(0,0,0,0.1);}
        header h1 {font-size: 24px; margin-bottom: 10px;}
       .admin-bar {background: #222; color: #FFD700; padding: 10px; display: flex; gap: 10px; justify-content: center; flex-wrap: wrap;}
       .btn {background: #007B00; color: white; padding: 8px 15px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer;}
       .btn-danger {background: #d32f2f;}
       .btn-add {background: #FFD700; color: #222;}
       .categories {display: flex; gap: 10px; padding: 15px; overflow-x: auto; background: white;}
       .cat-btn {background: #eee; border: none; padding: 10px 20px; border-radius: 20px; font-weight: bold; cursor: pointer; white-space: nowrap;}
       .cat-btn.active {background: #222; color: #FFD700;}
       .products {padding: 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px;}
       .card {background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.1); position: relative;}
       .card img {width: 100%; height: 160px; object-fit: cover;}
       .card-body {padding: 12px;}
       .card input {width: 100%; border: 1px solid #ddd; padding: 5px; margin: 3px 0; border-radius: 4px; font-size: 14px;}
       .price {color: #007B00; font-weight: bold; font-size: 18px; margin: 8px 0;}
       .qty-controls {display: flex; align-items: center; justify-content: space-between; margin: 8px 0;}
       .qty-btn {background: #eee; border: none; width: 30px; height: 30px; border-radius: 50%; font-weight: bold; cursor: pointer;}
       .qty-num {font-weight: bold;}
       .btn-order {background: #25D366; color: white; width: 100%; padding: 10px; border: none; border-radius: 8px; font-weight: bold; text-decoration: none; display: block; text-align: center; margin-top: 5px;}
       .delete-btn {position: absolute; top: 5px; left: 5px; background: #d32f2f; color: white; border: none; border-radius: 50%; width: 25px; height: 25px; cursor: pointer;}
       .save-bar {position: fixed; bottom: 0; left: 0; right: 0; background: #222; padding: 15px; text-align: center; z-index: 200;}
        footer {text-align: center; padding: 20px; background: #222; color: #FFD700; margin-top: 30px;}
       .hidden {display: none;}
    </style>
</head>
<body>
    <header>
        <h1>🛒 سوق مصطفى - وضع التعديل</h1>
        <div class="admin-bar">
            <button class="btn btn-add" onclick="addCategory()">+ إضافة فئة</button>
            <button class="btn btn-add" onclick="addProduct()">+ إضافة منتج</button>
            <button class="btn" onclick="downloadHTML()">💾 حفظ التعديلات</button>
        </div>
    </header>

    <div class="categories" id="categories"></div>
    <div class="products" id="products"></div>

    <footer>
        سوق مصطفى © 2026 | للطلب والاستفسار واتساب: 0117482348
    </footer>

    <script>
        const WA_NUMBER = "249117482348";
        let categories = [
            {id: 'all', name: 'الكل'},
            {id: 'phones', name: 'هواتف'},
            {id: 'clothes', name: 'ملابس'},
            {id: 'home', name: 'أواني منزلية'},
        ];

        let products = [
            {id: 1, cat: 'phones', name: 'ايفون 14 برو', price: '550000', qty: 10, img: 'https://images.unsplash.com/photo-1598327105666-5b89351aff97?w=400'},
            {id: 2, cat: 'clothes', name: 'تيشيرت قطن', price: '8000', qty: 50, img: 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400'},
        ];

        let currentCat = 'all';
        let nextId = 3;

        function renderCategories() {
            const catDiv = document.getElementById('categories');
            catDiv.innerHTML = '';
            categories.forEach(cat => {
                catDiv.innerHTML += `<button class="cat-btn ${cat.id === currentCat? 'active' : ''}" onclick="filterCat('${cat.id}')">${cat.name}</button>`;
            });
        }

        function renderProducts() {
            const prodDiv = document.getElementById('products');
            prodDiv.innerHTML = '';
            const filtered = currentCat === 'all'? products : products.filter(p => p.cat === currentCat);
            filtered.forEach(p => {
                const msg = `عايز اطلب: ${p.name} - السعر: ${p.price} ج.س - الكمية: 1`;
                prodDiv.innerHTML += `
                    <div class="card" data-id="${p.id}">
                        <button class="delete-btn" onclick="deleteProduct(${p.id})">×</button>
                        <img src="${p.img}" alt="${p.name}">
                        <div class="card-body">
                            <input value="${p.name}" onchange="updateProduct(${p.id}, 'name', this.value)">
                            <input type="number" value="${p.price}" onchange="updateProduct(${p.id}, 'price', this.value)">
                            <div class="price">${p.price} ج.س</div>
                            <div class="qty-controls">
                                <button class="qty-btn" onclick="changeQty(${p.id}, -1)">-</button>
                                <span class="qty-num">${p.qty}</span>
                                <button class="qty-btn" onclick="changeQty(${p.id}, 1)">+</button>
                            </div>
                            <a href="https://wa.me/${WA_NUMBER}?text=${encodeURIComponent(msg)}" class="btn-order">اطلب الآن</a>
                        </div>
                    </div>`;
            });
        }

        function filterCat(cat) {
            currentCat = cat;
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            event.target.classList.add('active');
            renderProducts();
        }

        function changeQty(id, change) {
            const p = products.find(p => p.id === id);
            p.qty = Math.max(0, p.qty + change);
            renderProducts();
        }

        function updateProduct(id, field, value) {
            const p = products.find(p => p.id === id);
            p[field] = field === 'price'? value.replace(/\D/g,'') : value;
            renderProducts();
        }

        function deleteProduct(id) {
            if(confirm('متأكد عايز تحذف المنتج؟')) {
                products = products.filter(p => p.id!== id);
                renderProducts();
            }
        }

        function addProduct() {
            const name = prompt('اسم المنتج:');
            if(!name) return;
            const price = prompt('السعر بالجنيه:');
            const img = prompt('رابط الصورة:', 'https://images.unsplash.com/photo-1521572163474-6864f9cf17ab?w=400');
            products.push({id: nextId++, cat: currentCat === 'all'? 'phones' : currentCat, name, price: price || '0', qty: 1, img});
            renderProducts();
        }

        function addCategory() {
            const name = prompt('اسم الفئة الجديدة:');
            if(!name) return;
            const id = name.replace(/\s+/g, '_');
            categories.push({id, name});
            renderCategories();
        }

        function downloadHTML() {
            // نحول البيانات لـ كود ثابت عشان يشتغل للزبائن
            let html = document.documentElement.outerHTML;
            // نحذف أزرار التعديل من النسخة النهائية
            html = html.replace(/class="delete-btn".*?×<\/button>/g, '');
            html = html.replace(/<div class="admin-bar">.*?<\/div>/s, '');
            html = html.replace(/<input.*?onchange="updateProduct.*?>/g, (match) => {
                const val = match.match(/value="(.*?)"/)[1];
                return `<h3>${val}</h3>`;
            });

            const blob = new Blob([html], {type: 'text/html'});
            const a = document.createElement('a');
            a.href = URL.createObjectURL(blob);
            a.download = 'index.html';
            a.click();
            alert('تم تنزيل ملف index.html الجديد. ارفعه على GitHub بدل القديم');
        }

        // شغل الموقع
        renderCategories();
        renderProducts();
    </script>
</body>
</html>
